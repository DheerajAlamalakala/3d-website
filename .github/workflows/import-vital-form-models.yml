name: Import VITAL-FORM anatomy models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-vital-form-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the CC0 GLB models
        run: |
          python - <<'PY'
          import os, re, sys
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          PAGES = {
            "full-adult-skeleton-standing.glb": "https://www.innerscene.com/tools/library/3d-parts/full-adult-skeleton-standing-ade55011",
            "full-body-muscular-system-selected-deep-layer.glb": "https://www.innerscene.com/tools/library/3d-parts/full-body-muscular-system-selected-deep-layer-959a514b",
            "torso-with-removable-organs.glb": "https://www.innerscene.com/tools/library/3d-parts/torso-with-removable-organs-1fe1b70a",
          }

          class Links(HTMLParser):
            def __init__(self):
              super().__init__()
              self.links, self.current = [], None
            def handle_starttag(self, tag, attrs):
              attrs = dict(attrs)
              if tag == "a":
                self.current = [attrs.get("href", ""), ""]
              for key, value in attrs.items():
                if value and any(x in key.lower() for x in ("download", "file", "asset", "href", "src")):
                  if any(x in value.lower() for x in (".glb", "download", "asset", "file")):
                    self.links.append(value)
            def handle_data(self, data):
              if self.current is not None:
                self.current[1] += data
            def handle_endtag(self, tag):
              if tag == "a" and self.current is not None:
                href, label = self.current
                if href and ("download" in label.lower() or ".glb" in href.lower() or "download" in href.lower()):
                  self.links.append(href)
                self.current = None

          headers = {"User-Agent": "Mozilla/5.0 (compatible; VITAL-FORM-asset-import/1.0)", "Accept": "*/*"}
          os.makedirs("public/models", exist_ok=True)
          failures = []
          for filename, page_url in PAGES.items():
            print(f"\nInspecting {page_url}", flush=True)
            req = Request(page_url, headers=headers)
            with urlopen(req, timeout=45) as response:
              html = response.read().decode("utf-8", "replace")
              base = response.geturl()
            parser = Links()
            parser.feed(html)
            candidates = []
            for candidate in parser.links:
              if candidate.startswith("//"):
                candidate = "https:" + candidate
              elif candidate.startswith("/"):
                candidate = urljoin(base, candidate)
              elif not candidate.startswith(("http://", "https://")):
                continue
              if candidate not in candidates:
                candidates.append(candidate)
            for candidate in re.findall(r"""(?:https?:)?//[^\s"'<>]+?\.glb(?:\?[^\s"'<>]*)?""", html, re.I):
              candidate = ("https:" + candidate) if candidate.startswith("//") else candidate
              if candidate not in candidates:
                candidates.append(candidate)

            saved = False
            for candidate in candidates:
              try:
                download_req = Request(candidate, headers=headers)
                with urlopen(download_req, timeout=120) as response:
                  data = response.read()
                  final_url = response.geturl()
                if data[:4] == b"glTF" and len(data) > 100_000:
                  out = os.path.join("public/models", filename)
                  with open(out, "wb") as f:
                    f.write(data)
                  print(f"Downloaded {filename}: {len(data):,} bytes from {final_url}", flush=True)
                  saved = True
                  break
              except Exception as exc:
                print(f"Candidate failed: {candidate} ({exc})", flush=True)
            if not saved:
              print("No direct GLB URL found. Download-like links:", flush=True)
              for candidate in candidates[:30]:
                print("  " + candidate, flush=True)
              failures.append(filename)

          if failures:
            print("\nCould not retrieve: " + ", ".join(failures), file=sys.stderr)
            sys.exit(1)

          license_text = """VITAL/FORM — 3D MODEL ASSET NOTES

          Source: Innerscene 3D Parts Library.
          - Full adult skeleton, standing — CC0
          - Full-body muscular system - selected deep layer — CC0
          - Torso with removable organs — CC0 (adapted from MakeHuman/MPFB CC0 assets)

          CC0 permits use, modification and redistribution, including commercial use, without attribution being required. Retaining this note is recommended.

          These are educational visual assets, not clinically validated diagnostic or treatment tools.
          """
          with open("public/models/ASSET-LICENSES.txt", "w", encoding="utf-8") as f:
            f.write(license_text)
          PY
      - name: Commit model assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models
          if git diff --cached --quiet; then
            echo "No new model files to commit."
          else
            git commit -m "Add CC0 3D anatomy model assets"
            git push origin main
          fi
